[package]
name = "rsi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rsi-desktop-bridge = { path = "../../crates/rsi/desktop-bridge" }
rsi-packages = { path = "../../crates/rsi/packages" }
rsi-web-control = { path = "../../crates/rsi/web-control" }
rsi-service-host = { path = "../../crates/rsi/service-host" }
rsi-session-protocol = { path = "../../crates/rsi/session-protocol" }
getrandom.workspace = true
hex.workspace = true
async-stream.workspace = true
rsi-session-export = { path = "../../crates/rsi/session-export" }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-clipboard-manager = "=2.3.3"
rsi-host = { path = "../../crates/rsi-host/core" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "signal"] }
tokio-util.workspace = true
tauri = "=2.11.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
rsi-files-native-fs = { path = "../../crates/rsi-files/native-fs" }

[build-dependencies]
tauri-build = "=2.6.3"

[lints]
workspace = true
