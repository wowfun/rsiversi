[package]
name = "rsi-app-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "signal", "time", "fs"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
rsi-agent-session-protocol = { path = "../../crates/rsi-agent/session-protocol" }
rsi-ai-protocol = { path = "../../crates/rsi-ai/protocol" }
rsi-build-info = { path = "../../crates/rsi/build-info" }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
nix = { version = "0.29", features = ["signal", "term"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
