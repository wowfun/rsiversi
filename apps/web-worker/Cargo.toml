[package]
name = "rsi-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsi-build-info = { path = "../../crates/rsi/build-info" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rsi-workspace-review-ui = { path = "../../crates/rsi/workspace-review-ui" }
rsi-workbench-ui = { path = "../../crates/rsi/workbench-ui" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
rsi-web-assets-api = { path = "../../crates/rsi/web-assets-api" }
rsi-session-tree-ui = { path = "../../crates/rsi/session-tree-ui" }
rsi-session-files-ui = { path = "../../crates/rsi/session-files-ui" }
rsi-ui = { path = "../../crates/rsi/ui" }
rsi-session-ui = { path = "../../crates/rsi/session-ui" }
rsi-api-protocol = { path = "../../crates/rsi-api/protocol" }
rsi-client-composition = { path = "../../crates/rsi/client-composition" }
rsi-host = { path = "../../crates/rsi-host/core" }
rsi-meta = { path = "../../crates/rsi-meta/core" }
rsi-meta-execution = { path = "../../crates/rsi-meta/execution" }
tokio = { workspace = true, features = ["sync", "macros"] }
rsi-gui = { path = "../../crates/rsi/gui" }
web-sys = { workspace = true, features = ["Crypto", "WorkerGlobalScope"] }
js-sys.workspace = true
rsi-api-browser-client = { path = "../../crates/rsi-api/browser-client" }
rsi-credentials-protocol = { path = "../../crates/rsi-credentials/protocol" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
zeroize.workspace = true

[lints]
workspace = true
