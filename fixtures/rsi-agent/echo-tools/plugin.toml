format_version = 0
provides = ["rsi.agent.tools", "fixture.rsi-agent.tools-observer"]
config_schema = "config.schema.json"

[package]
id = "fixture.rsi-agent.echo-tools"
version = "0.0.1"

[host_api]
major = 0
minimum_minor = 0

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
path = "target/native/x86_64-unknown-linux-gnu/librsi_agent_fixture_echo_tools.so"

[[artifacts]]
target = "aarch64-apple-darwin"
path = "target/native/aarch64-apple-darwin/librsi_agent_fixture_echo_tools.dylib"

[[injects]]
contract = "runtime.tick"
required = true
