format_version = 0

[composition]
id = "rsi-agent-keyless-conformance"
mode = "development"

[[scopes]]
id = "root"

[[scopes]]
id = "agent"
parent = "root"

[[instances]]
id = "scripted-model"
package = "../../scripted-model/plugin.toml"
scope = "root"
config = {}

[[instances]]
id = "echo-tools"
package = "../../echo-tools/plugin.toml"
scope = "root"
config = {}

[[instances]]
id = "agent-capability-anchor"
package = "../../capability-anchor/plugin.toml"
scope = "agent"
config = {}
bindings = { "rsi.ai.language" = "scripted-model", "rsi.ai.image" = "scripted-model", "rsi.ai.transcription" = "scripted-model", "rsi.ai.speech" = "scripted-model", "rsi.ai.realtime" = "scripted-model", "rsi.agent.tools" = "echo-tools", "fixture.rsi-agent.tools-observer" = "echo-tools" }
