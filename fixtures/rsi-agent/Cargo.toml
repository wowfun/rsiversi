[workspace]
members = [
    "capability-anchor",
    "conformance",
    "echo-tools",
    "scripted-model",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[workspace.dependencies]
rsi-agent = { path = "../../crates/rsi-agent/core" }
rsi-agent-protocol = { path = "../../crates/rsi-agent/protocol" }
rsi-ai = { path = "../../crates/rsi-ai/core" }
rsi-ai-auth = { path = "../../crates/rsi-ai/auth" }
rsi-ai-meta = { path = "../../crates/rsi-ai/meta" }
rsi-ai-protocol = { path = "../../crates/rsi-ai/protocol" }
rsi-ai-provider = { path = "../../crates/rsi-ai/provider" }
rsi-ai-testkit = { path = "../../crates/rsi-ai/testkit" }
rsi-meta = { path = "../../crates/rsi-meta/core" }
rsi-meta-loader = { path = "../../crates/rsi-meta/loader" }
rsi-meta-plugin = { path = "../../crates/rsi-meta/plugin" }
rsi-meta-plugin-testkit = { path = "../rsi-meta/plugin-testkit" }
serde_json = "1.0"
futures-util = "0.3"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
