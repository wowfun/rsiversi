format_version = 0
config_schema = "config.schema.json"

[package]
id = "fixture.rsi-agent.capability-anchor"
version = "0.0.1"

[host_api]
major = 0
minimum_minor = 0

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
path = "target/native/x86_64-unknown-linux-gnu/librsi_agent_fixture_capability_anchor.so"

[[artifacts]]
target = "aarch64-apple-darwin"
path = "target/native/aarch64-apple-darwin/librsi_agent_fixture_capability_anchor.dylib"

[[injects]]
contract = "rsi.ai.language"
required = true

[[injects]]
contract = "rsi.ai.image"
required = true

[[injects]]
contract = "rsi.ai.transcription"
required = true

[[injects]]
contract = "rsi.ai.speech"
required = true

[[injects]]
contract = "rsi.ai.realtime"
required = true

[[injects]]
contract = "rsi.agent.tools"
required = true

[[injects]]
contract = "fixture.rsi-agent.tools-observer"
required = true

[[injects]]
contract = "runtime.tick"
required = true
