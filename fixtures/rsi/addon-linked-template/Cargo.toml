[package]
name = "rsi-addon-linked-template"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
rsi = { path = "../../../crates/rsi/core" }
rsi-host = { path = "../../../crates/rsi-host/core" }
rsi-meta = { path = "../../../crates/rsi-meta/core" }
async-trait = "0.1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace]

[lints.rust]
unsafe_code = "deny"
