[package]
name = "rsi-addon-template"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rsi-meta-native = { git = "https://github.com/wowfun/rsiversi.git", rev = "386858d6f266fdf8d5c58e19793e5d2d09d3da34" }
rsi-tools-protocol = { git = "https://github.com/wowfun/rsiversi.git", rev = "386858d6f266fdf8d5c58e19793e5d2d09d3da34" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[workspace]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
