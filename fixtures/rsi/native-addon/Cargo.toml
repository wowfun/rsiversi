[package]
name = "rsi-fixture-native-addon"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rsi-ai-protocol = { path = "../../../crates/rsi-ai/protocol" }
rsi-api-protocol = { path = "../../../crates/rsi-api/protocol" }
rsi-meta-native = { path = "../../../crates/rsi-meta/native" }
rsi-tools-protocol = { path = "../../../crates/rsi-tools/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
