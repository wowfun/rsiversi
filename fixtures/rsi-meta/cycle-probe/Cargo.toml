[package]
name = "rsi-meta-fixture-cycle-probe"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "0.1"
rsi-meta = { path = "../../../crates/rsi-meta/core" }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }

[workspace]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
