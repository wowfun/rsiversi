format_version = 0
provides = ["fixture.lifecycle-probe"]
capabilities = ["state.cas", "control.apply-manifest"]
config_schema = "config.schema.json"

[package]
id = "fixture.lifecycle-probe"
version = "0.0.1"

[host_api]
major = 0
minimum_minor = 0

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
path = "target/x86_64-unknown-linux-gnu/release/librsi_meta_fixture_lifecycle_probe.so"

[[artifacts]]
target = "aarch64-apple-darwin"
path = "target/aarch64-apple-darwin/release/librsi_meta_fixture_lifecycle_probe.dylib"

[[injects]]
contract = "state.cas"
required = true

[[injects]]
contract = "fixture.echo"
required = false

[[injects]]
contract = "runtime.tick"
required = true
