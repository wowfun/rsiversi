[package]
name = "rsi-meta-plugin-testkit"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
rsi-meta-frame-contract = { path = "../../../plugins/rsi-meta/frame-contract" }
rsi-meta-plugin = { path = "../../../crates/rsi-meta/plugin" }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[workspace]

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
