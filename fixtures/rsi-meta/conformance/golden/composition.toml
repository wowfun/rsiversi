format_version = 0

[composition]
id = "golden-composition"
mode = "development"

[[scopes]]
id = "root"

[[scopes]]
id = "workspace"
parent = "root"

[[instances]]
id = "echo"
package = "../../echo-bidi/plugin.toml"
scope = "root"
enabled = true
config = {}

[[instances]]
id = "consumer"
package = "../../nested-scope-consumer/plugin.toml"
scope = "workspace"
enabled = true
config = { request_id = "golden-request", message = "hello from the golden composition" }

[instances.bindings]
"fixture.echo" = "echo"
