[package]
name = "rsi-meta-fixture-conformance"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
jsonschema = { version = "0.33", default-features = false }
rsi-meta-loader = { path = "../../../crates/rsi-meta/loader" }
serde_json = "1.0"
tempfile = "3.20"
toml = "0.9"

[dev-dependencies]
rsi-meta = { path = "../../../crates/rsi-meta/core" }
rsi-meta-cli = { path = "../../../crates/rsi-meta/cli" }
rsi-meta-frame-contract = { path = "../../../plugins/rsi-meta/frame-contract" }
rsi-meta-plugin = { path = "../../../crates/rsi-meta/plugin" }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[workspace]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
