[package]
name = "rsi-meta-browser-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsi-meta = { path = "../../../crates/rsi-meta/core" }
rsi-meta-execution = { path = "../../../crates/rsi-meta/execution" }
rsi-host = { path = "../../../crates/rsi-host/core" }
rsi-meta-scope = { path = "../../../crates/rsi-meta/scope" }
rsi-meta-profile = { path = "../../../crates/rsi-meta/profile" }
async-trait = "0.1"
futures-util = "0.3"
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1.47", features = ["sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
