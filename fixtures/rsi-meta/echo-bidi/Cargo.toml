[package]
name = "rsi-meta-fixture-echo-bidi"
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rsi-meta-native = { path = "../../../crates/rsi-meta/native" }
serde_json = "1.0"

[workspace]

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
