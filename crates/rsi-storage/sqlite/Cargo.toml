[package]
name = "rsi-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
rsi-meta = { path = "../../rsi-meta/core" }
rsi-storage = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
rsi-files-native-fs = { path = "../../rsi-files/native-fs" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
rsi-storage-domain = { path = "../domain" }
tempfile.workspace = true

[lints]
workspace = true
