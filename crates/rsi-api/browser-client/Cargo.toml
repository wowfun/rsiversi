[package]
name = "rsi-api-browser-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rsi-api-protocol = { path = "../protocol" }
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-stream.workspace = true
async-trait.workspace = true
futures-util.workspace = true
http.workspace = true
js-sys.workspace = true
rsi-api-client = { path = "../client" }
rsi-credentials-protocol = { path = "../../rsi-credentials/protocol" }
rsi-meta = { path = "../../rsi-meta/core" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["AbortController", "AbortSignal", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "Headers", "Request", "RequestInit", "RequestCredentials", "RequestMode", "RequestRedirect", "Response", "ReadableStream", "ReadableStreamByobReader"] }
zeroize.workspace = true

[lints]
workspace = true
