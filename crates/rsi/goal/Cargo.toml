serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rsi-agent-composition-protocol = { path = "../../rsi-agent/composition-protocol" }
rsi-agent-context = { path = "../../rsi-agent/context" }
rsi-ai-protocol = { path = "../../rsi-ai/protocol" }
rsi-sandbox = { path = "../../rsi-sandbox/core" }
rsi-tools = { path = "../../rsi-tools/core" }
rsi-tools-protocol = { path = "../../rsi-tools/protocol" }
