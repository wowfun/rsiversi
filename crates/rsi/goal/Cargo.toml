[package]
name = "rsi-goal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util.workspace = true
async-stream.workspace = true
thiserror.workspace = true
async-trait.workspace = true
rsi-agent-goal = { path = "../../rsi-agent/goal" }
rsi-agent-session-protocol = { path = "../../rsi-agent/session-protocol" }
rsi-agent-turn-protocol = { path = "../../rsi-agent/turn-protocol" }
rsi-meta = { path = "../../rsi-meta/core" }
