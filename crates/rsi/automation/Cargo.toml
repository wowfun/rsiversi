rsi-automation-api = { path = "../automation-api" }
rsi-agent-session-protocol = { path = "../../rsi-agent/session-protocol" }
rsi-agent-composition-protocol = { path = "../../rsi-agent/composition-protocol" }
rsi-agent-turn-protocol = { path = "../../rsi-agent/turn-protocol" }
