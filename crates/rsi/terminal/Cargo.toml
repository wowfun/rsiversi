[package]
name = "rsi-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rsi-session-files = { path = "../session-files" }
rsi-session-files-ui = { path = "../session-files-ui" }
rsi-ui = { path = "../ui" }
rsi-session-ui = { path = "../session-ui" }
zeroize.workspace = true
rsi-api-device-api = { path = "../../rsi-api/device-api" }
rsi-application = { path = "../application" }
rsi-client = { path = "../client" }
rsi-conversation = { path = "../conversation" }
bytes.workspace = true
rsi-api-protocol = { path = "../../rsi-api/protocol" }
rsi-session-protocol = { path = "../session-protocol" }
rsi-user-questions-protocol = { path = "../../rsi-user-questions/protocol" }
async-trait.workspace = true
base64.workspace = true
crossterm.workspace = true
futures-util.workspace = true
getrandom.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
hex.workspace = true
rsi-agent-session-protocol = { path = "../../rsi-agent/session-protocol" }
rsi-agent-store-protocol = { path = "../../rsi-agent/store-protocol" }
rsi-agent-turn-protocol = { path = "../../rsi-agent/turn-protocol" }
rsi-ai-protocol = { path = "../../rsi-ai/protocol" }
rsi-approval-protocol = { path = "../../rsi-approval/protocol" }
rsi-media-protocol = { path = "../../rsi-media/protocol" }
rsi-meta = { path = "../../rsi-meta/core" }
rsi-host = { path = "../../rsi-host/core" }
rsi-process = { path = "../../rsi-process/core" }
rsi-sandbox = { path = "../../rsi-sandbox/core" }
rsi-tools-protocol = { path = "../../rsi-tools/protocol" }
rsi-workspace-protocol = { path = "../../rsi-workspace/protocol" }
serde.workspace = true
serde_json.workspace = true
termina.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
vt100.workspace = true
portable-pty.workspace = true
filedescriptor.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
