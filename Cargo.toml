[workspace]
members = ["crates/*/*"]
exclude = ["crates/rsi-meta/docs"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http = "1.3"
hyper = { version = "1.10", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
jsonschema = "0.33"
keyring = { version = "3.6", features = ["apple-native", "linux-native-sync-persistent"] }
libc = "0.2"
libloading = "0.8"
percent-encoding = "2.3"
pulldown-cmark = "0.10"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
yaml_serde = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
