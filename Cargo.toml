[workspace]
members = ["crates/*/*"]
exclude = [
    "crates/rsi-agent/docs",
    "crates/rsi-ai/docs",
    "crates/rsi-meta/docs",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = { version = "1.10", features = ["serde"] }
cap-std = "4.0.3"
crossterm = "0.29"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
jsonschema = { version = "0.33", default-features = false }
# Keep the JS/WASM bindings family aligned with the matching wasm-bindgen CLI in CI.
js-sys = "=0.3.104"
keyring = { version = "3.6", features = ["apple-native", "linux-native-sync-persistent"] }
libc = "0.2"
libloading = "0.8"
memchr = "2.7"
percent-encoding = "2.3"
pulldown-cmark = "0.10"
portable-pty = "0.9"
vt100 = "0.16.2"
ratatui = "0.30.2"
# Repository CST checks depend on this unstable 0.0.x syntax API and token behavior.
ra_ap_syntax = "=0.0.349"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rhai = { version = "1.23", features = ["serde", "sync"] }
rustix = { version = "1.1", features = ["fs", "process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
tempfile = "3.20"
termina = "0.3.3"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = "=0.3.104"
toml = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"
yaml_serde = "0.10"
zeroize = "1.8"
url = "2.5"

[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
