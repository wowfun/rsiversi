[workspace]
members = ["crates/*/*"]
exclude = [
    "crates/rsi-agent/docs",
    "crates/rsi-ai/docs",
    "crates/rsi-meta/docs",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
jsonschema = { version = "0.33", default-features = false }
keyring = { version = "3.6", features = ["apple-native", "linux-native-sync-persistent"] }
libc = "0.2"
libloading = "0.8"
memchr = "2.7"
percent-encoding = "2.3"
pulldown-cmark = "0.10"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
yaml_serde = "0.10"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
