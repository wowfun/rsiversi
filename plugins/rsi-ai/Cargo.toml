[workspace]
members = ["openai", "openai-compatible-chat", "deepseek", "xiaomi"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
rsi-ai = { path = "../../crates/rsi-ai/core" }
rsi-ai-deepseek = { path = "../../crates/rsi-ai/deepseek" }
rsi-ai-meta = { path = "../../crates/rsi-ai/meta" }
rsi-ai-protocol = { path = "../../crates/rsi-ai/protocol" }
rsi-ai-openai = { path = "../../crates/rsi-ai/openai" }
rsi-ai-openai-compatible = { path = "../../crates/rsi-ai/openai-compatible" }
rsi-ai-provider = { path = "../../crates/rsi-ai/provider" }
rsi-ai-transport = { path = "../../crates/rsi-ai/transport" }
rsi-ai-xiaomi = { path = "../../crates/rsi-ai/xiaomi" }
rsi-meta-plugin = { path = "../../crates/rsi-meta/plugin" }
rsi-meta-plugin-testkit = { path = "../../fixtures/rsi-meta/plugin-testkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow", priority = 0 }
must_use_candidate = { level = "allow", priority = 0 }
