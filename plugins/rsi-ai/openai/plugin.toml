format_version = 0
provides = ["rsi.ai.language", "rsi.ai.image", "rsi.ai.transcription", "rsi.ai.speech", "rsi.ai.realtime"]
config_schema = "config.schema.json"

[package]
id = "rsi-ai.openai"
version = "0.0.1"

[host_api]
major = 0
minimum_minor = 0

[[injects]]
contract = "runtime.tick"
required = true

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
path = "target/native/x86_64-unknown-linux-gnu/librsi_ai_plugin_openai.so"

[[artifacts]]
target = "aarch64-apple-darwin"
path = "target/native/aarch64-apple-darwin/librsi_ai_plugin_openai.dylib"
