name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - name: Verify documentation
        timeout-minutes: 10
        env:
          RSI_AGENT_NOTES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask verify-docs
      - name: Build public Rust documentation
        timeout-minutes: 15
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --lib --no-deps
      - name: Exercise Rust documentation examples
        timeout-minutes: 15
        run: cargo test --locked --workspace --doc

  rsi-meta-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  rsi-base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint Base services
        run: cargo clippy --locked -p rsi-host -p 'rsi-storage*' -p 'rsi-settings*' -p 'rsi-credentials*' -p 'rsi-media*' -p 'rsi-approval*' -p 'rsi-permission*' -p 'rsi-sandbox*' -p 'rsi-commands*' -p 'rsi-jobs*' -p rsi-projection -p 'rsi-tools*' -p rsi-workspace --all-targets -- -D warnings
        timeout-minutes: 30
      - name: Exercise Base services
        run: cargo test --locked -p rsi-host -p 'rsi-storage*' -p 'rsi-settings*' -p 'rsi-credentials*' -p 'rsi-media*' -p 'rsi-approval*' -p 'rsi-permission*' -p 'rsi-sandbox*' -p 'rsi-commands*' -p 'rsi-jobs*' -p rsi-projection -p 'rsi-tools*' -p rsi-workspace --all-targets
        timeout-minutes: 30
      - name: Exercise Tool JSON feature-unification boundary
        if: runner.os == 'Linux'
        run: cargo test --locked -p rsi-tools-protocol --all-targets --features serde_json/arbitrary_precision
        timeout-minutes: 10

  rsi-ai:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint rsi-ai
        run: cargo clippy --locked -p 'rsi-ai*' --all-targets --all-features -- -D warnings
        timeout-minutes: 30
      - name: Exercise rsi-ai
        run: cargo test --locked -p 'rsi-ai*' --all-targets --all-features
        timeout-minutes: 30

  rsi-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint rsi-agent
        run: cargo clippy --locked -p 'rsi-agent*' --all-targets -- -D warnings
        timeout-minutes: 20
      - name: Exercise rsi-agent
        run: cargo test --locked -p 'rsi-agent*' --all-targets
        timeout-minutes: 20

  rsi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint standard rsi
        run: cargo clippy --locked -p rsi --all-targets -- -D warnings
        timeout-minutes: 20
      - name: Exercise standard rsi
        run: cargo test --locked -p rsi --all-targets
        timeout-minutes: 20

  repository-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Check repository formatting
        run: cargo fmt --all --check
        timeout-minutes: 10
      - name: Lint repository tools
        run: cargo clippy --locked -p rsi-xtask --all-targets -- -D warnings
        timeout-minutes: 15
      - name: Exercise repository tools
        run: cargo test --locked -p rsi-xtask --all-targets
        timeout-minutes: 15

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - run: cargo install cargo-audit --locked --version 0.22.2
        timeout-minutes: 15
      - name: Audit every committed Cargo lockfile
        timeout-minutes: 15
        shell: bash
        run: |
          cargo audit --file ./Cargo.lock
          while IFS= read -r lockfile; do
            cargo audit --no-fetch --file "$lockfile"
          done < <(find . -name Cargo.lock -not -path '*/target/*' ! -path './Cargo.lock' -print | sort)

  windows-rsi-meta:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected an x86_64 runner, found $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance and native echo-bidi
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  ci-required:
    if: always()
    needs:
      - documentation
      - rsi-meta-conformance
      - rsi-base
      - rsi-ai
      - rsi-agent
      - rsi
      - repository-tools
      - dependency-audit
      - windows-rsi-meta
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI contract
        env:
          DOCUMENTATION: ${{ needs.documentation.result }}
          RSI_META_CONFORMANCE: ${{ needs.rsi-meta-conformance.result }}
          RSI_BASE: ${{ needs.rsi-base.result }}
          RSI_AI: ${{ needs.rsi-ai.result }}
          RSI_AGENT: ${{ needs.rsi-agent.result }}
          RSI: ${{ needs.rsi.result }}
          REPOSITORY_TOOLS: ${{ needs.repository-tools.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          WINDOWS_RSI_META: ${{ needs.windows-rsi-meta.result }}
        run: |
          test "$DOCUMENTATION" = success
          test "$RSI_META_CONFORMANCE" = success
          test "$RSI_BASE" = success
          test "$RSI_AI" = success
          test "$RSI_AGENT" = success
          test "$RSI" = success
          test "$REPOSITORY_TOOLS" = success
          test "$DEPENDENCY_AUDIT" = success
          test "$WINDOWS_RSI_META" = success
