name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - name: Verify documentation
        timeout-minutes: 10
        env:
          RSI_AGENT_NOTES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask verify-docs
      - name: Build public Rust documentation
        timeout-minutes: 15
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --lib --no-deps
      - name: Exercise Rust documentation examples
        timeout-minutes: 15
        run: cargo test --locked --workspace --doc

  rsi-meta-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  rsi-meta-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            fixtures/rsi-meta/browser-probe/package-lock.json
            fixtures/rsi-api/browser-probe/package-lock.json
            fixtures/rsi-api/browser-fetch/package-lock.json
            fixtures/rsi/client-probe/package-lock.json
            fixtures/rsi/web-product/package-lock.json
            plugins/rsi/web/package-lock.json
      - name: Install matching bindings generator
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Install browser harness and engines
        timeout-minutes: 10
        working-directory: fixtures/rsi-meta/browser-probe
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox
      - name: Exercise real Worker conformance
        timeout-minutes: 10
        working-directory: fixtures/rsi-meta/browser-probe
        run: npm test
      - name: Exercise API ownership inside real Workers
        timeout-minutes: 10
        working-directory: fixtures/rsi-api/browser-probe
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Exercise actual browser Fetch and cookie cleanup
        timeout-minutes: 10
        working-directory: fixtures/rsi-api/browser-fetch
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Exercise shared application controllers inside real Workers
        timeout-minutes: 10
        working-directory: fixtures/rsi/client-probe
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Install native Web product dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap libdbus-1-dev pkg-config
      - name: Exercise the product Web application over TLS and HTTP/2
        timeout-minutes: 30
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-evidence
        run: |
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              previous_policy[$key]=$(sysctl -n "$key")
              sudo sysctl -w "$setting"
            fi
          done
          npm ci --ignore-scripts --prefix ../../../plugins/rsi/web
          npm run typecheck --prefix ../../../plugins/rsi/web
          npm test --prefix ../../../plugins/rsi/web
          npm ci --ignore-scripts
          npm test

      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-web-evidence
          path: ${{ runner.temp }}/rsi-web-evidence
          if-no-files-found: error

  rsi-base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint Base services
        run: cargo clippy --locked -p rsi-host -p 'rsi-api*' -p 'rsi-storage*' -p 'rsi-settings*' -p 'rsi-credentials*' -p 'rsi-media*' -p 'rsi-approval*' -p 'rsi-user-questions*' -p 'rsi-permission*' -p 'rsi-sandbox*' -p 'rsi-process*' -p 'rsi-commands*' -p 'rsi-jobs*' -p rsi-projection -p 'rsi-tools*' -p rsi-shell-bash -p rsi-apply-patch -p 'rsi-workspace*' -p 'rsi-files*' --all-targets -- -D warnings
        timeout-minutes: 30
      - name: Exercise Base services
        run: cargo test --locked -p rsi-host -p 'rsi-api*' -p 'rsi-storage*' -p 'rsi-settings*' -p 'rsi-credentials*' -p 'rsi-media*' -p 'rsi-approval*' -p 'rsi-user-questions*' -p 'rsi-permission*' -p 'rsi-sandbox*' -p 'rsi-process*' -p 'rsi-commands*' -p 'rsi-jobs*' -p rsi-projection -p 'rsi-tools*' -p rsi-shell-bash -p rsi-apply-patch -p 'rsi-workspace*' -p 'rsi-files*' --all-targets
        timeout-minutes: 30
      - name: Exercise Linux Bubblewrap enforcement
        if: runner.os == 'Linux'
        run: |
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          if [[ "${{ runner.os }}" == Linux ]]; then
            for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
              key=${setting%%=*}
              if [[ -e /proc/sys/${key//.//} ]]; then
                previous_policy[$key]=$(sysctl -n "$key")
                sudo sysctl -w "$setting"
              fi
            done
          fi
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact --list | rg --fixed-strings --line-regexp 'native_bubblewrap_enforces_read_only_and_workspace_write_plans: test'
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact
        timeout-minutes: 5
      - name: Exercise Tool JSON feature-unification boundary
        if: runner.os == 'Linux'
        run: cargo test --locked -p rsi-tools-protocol --all-targets --features serde_json/arbitrary_precision
        timeout-minutes: 10

  rsi-ai:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint rsi-ai
        run: cargo clippy --locked -p 'rsi-ai*' --all-targets --all-features -- -D warnings
        timeout-minutes: 30
      - name: Exercise rsi-ai
        run: cargo test --locked -p 'rsi-ai*' --all-targets --all-features
        timeout-minutes: 30

  rsi-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Lint rsi-agent
        run: cargo clippy --locked -p 'rsi-agent*' --all-targets -- -D warnings
        timeout-minutes: 20
      - name: Exercise rsi-agent
        run: cargo test --locked -p 'rsi-agent*' --all-targets
        timeout-minutes: 20

  rsi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Fetch native addon build fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/rsi/native-addon/Cargo.toml
      - name: Check independent native addon fixture
        run: |
          cargo fmt --manifest-path fixtures/rsi/native-addon/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fixtures/rsi/native-addon/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path fixtures/rsi/native-addon/Cargo.toml --all-targets --all-features -- -D warnings
        timeout-minutes: 10
      - name: Lint standard rsi
        run: cargo clippy --locked -p rsi -p rsi-service-host -p rsi-goal -p 'rsi-session*' -p rsi-application -p rsi-gui -p rsi-workbench-ui -p 'rsi-configuration*' -p rsi-managed-providers -p 'rsi-navigation*' -p 'rsi-client*' -p rsi-conversation -p 'rsi-ui*' -p rsi-inspector -p rsi-native-addons-api -p 'rsi-terminal*' -p rsi-serve -p 'rsi-web*' --all-targets -- -D warnings
        timeout-minutes: 20
      - name: Check independent terminal presentation
        run: |
          cargo fmt --manifest-path crates/rsi/terminal-native/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/rsi/terminal-native/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path crates/rsi/terminal-native/Cargo.toml --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --manifest-path crates/rsi/terminal-native/Cargo.toml --no-deps --all-features
        timeout-minutes: 15
      - name: Compile standard rsi tests
        run: cargo test --locked -p rsi -p rsi-service-host -p rsi-goal -p 'rsi-session*' -p rsi-application -p rsi-gui -p rsi-workbench-ui -p 'rsi-configuration*' -p rsi-managed-providers -p 'rsi-navigation*' -p 'rsi-client*' -p rsi-conversation -p 'rsi-ui*' -p rsi-inspector -p rsi-native-addons-api -p 'rsi-terminal*' -p rsi-serve -p 'rsi-web*' --all-targets --no-run
        timeout-minutes: 20
      - name: Exercise standard rsi on Linux
        if: runner.os == 'Linux'
        run: |
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          if [[ "${{ runner.os }}" == Linux ]]; then
            for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
              key=${setting%%=*}
              if [[ -e /proc/sys/${key//.//} ]]; then
                previous_policy[$key]=$(sysctl -n "$key")
                sudo sysctl -w "$setting"
              fi
            done
          fi
          cargo test --locked -p rsi -p rsi-service-host -p rsi-goal -p 'rsi-session*' -p rsi-application -p rsi-gui -p rsi-workbench-ui -p 'rsi-configuration*' -p rsi-managed-providers -p 'rsi-navigation*' -p 'rsi-client*' -p rsi-conversation -p 'rsi-ui*' -p rsi-inspector -p rsi-native-addons-api -p 'rsi-terminal*' -p rsi-serve -p 'rsi-web*' --all-targets
          cargo xtask dev tui --smoke --directory "$RUNNER_TEMP/rsi-dev-smoke" || {
            smoke_status=$?
            tail -c 1048576 "$RUNNER_TEMP/rsi-dev-smoke/logs/smoke.jsonl" || true
            exit "$smoke_status"
          }
        timeout-minutes: 35
      - name: Build Session API evaluation driver
        id: session_eval_build
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 10
        run: cargo build --locked -p rsi --example session-api-eval
      - name: Check Session API evaluation unit contracts
        if: runner.os == 'Linux' && !cancelled() && steps.session_eval_build.outcome == 'success'
        timeout-minutes: 5
        run: python3 fixtures/tools/python-tests.py crates/rsi/core/eval
      - name: Exercise Session API evaluation and oracle fault boundaries
        if: runner.os == 'Linux' && !cancelled() && steps.session_eval_build.outcome == 'success'
        timeout-minutes: 45
        run: |
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          if [[ "${{ runner.os }}" == Linux ]]; then
            for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
              key=${setting%%=*}
              if [[ -e /proc/sys/${key//.//} ]]; then
                previous_policy[$key]=$(sysctl -n "$key")
                sudo sysctl -w "$setting"
              fi
            done
          fi
          python3 crates/rsi/core/eval/session_api.py --self-test --pressure --output "$RUNNER_TEMP/rsi-session-api-evaluation"
      - name: Preserve Session API evaluation evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-session-api-evaluation
          path: ${{ runner.temp }}/rsi-session-api-evaluation
          if-no-files-found: warn
      - name: Exercise standard rsi on macOS
        if: runner.os == 'macOS'
        run: cargo test --locked -p rsi -p rsi-service-host -p rsi-goal -p 'rsi-session*' -p rsi-application -p rsi-gui -p rsi-workbench-ui -p 'rsi-configuration*' -p rsi-managed-providers -p 'rsi-navigation*' -p 'rsi-client*' -p rsi-conversation -p 'rsi-ui*' -p rsi-inspector -p rsi-native-addons-api -p 'rsi-terminal*' -p rsi-serve -p 'rsi-web*' --all-targets -- --nocapture
        timeout-minutes: 20

  repository-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Check repository formatting
        run: cargo fmt --all --check
        timeout-minutes: 10
      - name: Lint repository tools
        run: cargo clippy --locked -p rsi-xtask --all-targets -- -D warnings
        timeout-minutes: 15
      - name: Exercise repository tools
        run: cargo test --locked -p rsi-xtask --all-targets
        timeout-minutes: 15

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - run: cargo install cargo-audit --locked --version 0.22.2
        timeout-minutes: 15
      - name: Audit every committed Cargo lockfile
        timeout-minutes: 15
        shell: bash
        run: |
          cargo audit --file ./Cargo.lock
          while IFS= read -r lockfile; do
            cargo audit --no-fetch --file "$lockfile"
          done < <(find . -name Cargo.lock -not -path '*/target/*' ! -path './Cargo.lock' -print | sort)

  windows-rsi-meta:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected an x86_64 runner, found $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance and native echo-bidi
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  ci-required:
    if: always()
    needs:
      - rsi-desktop
      - documentation
      - rsi-meta-conformance
      - rsi-meta-browser
      - rsi-base
      - rsi-ai
      - rsi-agent
      - rsi
      - repository-tools
      - dependency-audit
      - windows-rsi-meta
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI contract
        env:
          DOCUMENTATION: ${{ needs.documentation.result }}
          RSI_META_CONFORMANCE: ${{ needs.rsi-meta-conformance.result }}
          RSI_META_BROWSER: ${{ needs.rsi-meta-browser.result }}
          RSI_BASE: ${{ needs.rsi-base.result }}
          RSI_AI: ${{ needs.rsi-ai.result }}
          RSI_AGENT: ${{ needs.rsi-agent.result }}
          RSI: ${{ needs.rsi.result }}
          RSI_DESKTOP: ${{ needs.rsi-desktop.result }}
          REPOSITORY_TOOLS: ${{ needs.repository-tools.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          WINDOWS_RSI_META: ${{ needs.windows-rsi-meta.result }}
        run: |
          test "$DOCUMENTATION" = success
          test "$RSI_META_CONFORMANCE" = success
          test "$RSI_META_BROWSER" = success
          test "$RSI_BASE" = success
          test "$RSI_AI" = success
          test "$RSI_AGENT" = success
          test "$RSI" = success
          test "$RSI_DESKTOP" = success
          test "$REPOSITORY_TOOLS" = success
          test "$DEPENDENCY_AUDIT" = success
          test "$WINDOWS_RSI_META" = success

  rsi-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb dbus-x11 bubblewrap
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
      - name: Lint and test desktop adapter
        timeout-minutes: 25
        run: |
          cargo clippy --locked -p rsi-desktop --all-targets -- -D warnings
          cargo test --locked -p rsi-desktop --all-targets
          cargo build --locked -p rsi-desktop --bin rsi-desktop
      - name: Exercise native admission
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a cargo run --locked --manifest-path fixtures/rsi/desktop-admission/Cargo.toml
      - name: Prepare native sandbox enforcement
        id: sandbox
        timeout-minutes: 10
        run: |
          : > "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              printf '%s=%s\n' "$key" "$(sysctl -n "$key")" >> "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
              sudo sysctl -w "$setting"
            fi
          done
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact --list | rg --fixed-strings --line-regexp 'native_bubblewrap_enforces_read_only_and_workspace_write_plans: test'
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact
      - name: Build shared document and desktop
        id: build
        if: ${{ !cancelled() }}
        timeout-minutes: 110
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo xtask dist desktop "$RUNNER_TEMP/rsi-desktop-dist" --debug
      - name: Exercise actual WebKitGTK first conversation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-evidence" --daemon --window-close --restart --save-failure --refresh-during-click --tasks --foreign-binary "$GITHUB_WORKSPACE/target/debug/rsi-desktop"
      - name: Exercise missing frame acknowledgement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-ack-evidence" --daemon --ack-timeout
      - name: Exercise startup close deadline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-startup-evidence" --daemon --startup-close
      - name: Restore native sandbox runner policy
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/rsi-desktop-sandbox-policy" ]]; then
            while IFS= read -r setting; do sudo sysctl -w "$setting"; done < "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
          fi
      - name: Test desktop diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 fixtures/tools/python-tests.py fixtures/rsi/desktop-product
      - name: Preserve desktop acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-desktop-evidence
          path: |
            ${{ runner.temp }}/rsi-desktop-evidence
            ${{ runner.temp }}/rsi-desktop-ack-evidence
            ${{ runner.temp }}/rsi-desktop-startup-evidence
          if-no-files-found: warn
