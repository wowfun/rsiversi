name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - id: docs_setup
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - name: Prepare Agent Notes baseline
        id: notes_base
        if: ${{ !cancelled() && steps.docs_setup.outcome == 'success' }}
        timeout-minutes: 5
        env:
          NOTES_EVENT: ${{ github.event_name }}
          NOTES_PR_BASE: ${{ github.event.pull_request.base.sha }}
          NOTES_PUSH_BEFORE: ${{ github.event.before }}
        shell: python3 {0}
        run: |
          import os, re, subprocess
          def git(*args):
              return subprocess.run(["git", *args], check=True, text=True, capture_output=True).stdout.strip()
          event = os.environ["NOTES_EVENT"]
          if event == "workflow_dispatch":
              git("fetch", "--no-tags", "origin", "+refs/heads/main:refs/remotes/origin/main")
              base = git("rev-parse", "refs/remotes/origin/main^{commit}")
          elif event == "pull_request":
              base = os.environ["NOTES_PR_BASE"]
          elif event == "push":
              base = os.environ["NOTES_PUSH_BEFORE"]
          else:
              raise RuntimeError("unsupported baseline event")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise RuntimeError("missing or invalid exact baseline SHA")
          if base == "0" * 40:
              if event != "push":
                  raise RuntimeError("empty baseline is only valid for first push")
          else:
              if subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], capture_output=True).returncode:
                  git("fetch", "--no-tags", "origin", base)
              git("cat-file", "-e", base + "^{commit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("base=" + base + "\n")
      - name: Verify documentation structure
        if: ${{ !cancelled() && steps.docs_setup.outcome == 'success' }}
        timeout-minutes: 5
        run: cargo xtask verify-docs --structure-only
      - name: Verify Agent Notes
        if: ${{ !cancelled() && steps.notes_base.outcome == 'success' }}
        timeout-minutes: 5
        env:
          RSI_AGENT_NOTES_BASE: ${{ steps.notes_base.outputs.base }}
        run: cargo xtask verify-agent-notes
      - name: Verify architecture
        if: ${{ !cancelled() && steps.docs_setup.outcome == 'success' }}
        timeout-minutes: 5
        run: cargo xtask verify-architecture
      - name: Build public Rust documentation
        if: ${{ !cancelled() && steps.docs_setup.outcome == 'success' }}
        timeout-minutes: 15
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --lib --no-deps
      - name: Exercise Rust documentation examples
        if: ${{ !cancelled() && steps.docs_setup.outcome == 'success' }}
        timeout-minutes: 15
        run: cargo test --locked --workspace --doc

  lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: lockfiles
      - name: Verify every workspace lockfile
        timeout-minutes: 20
        run: cargo xtask verify-lockfiles --online

  rsi-meta-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            expected_arch: x86_64
          - os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  rsi-meta-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 206
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: rust-analyzer
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            fixtures/rsi-meta/browser-probe/package-lock.json
            fixtures/rsi-api/browser-probe/package-lock.json
            fixtures/rsi-api/browser-fetch/package-lock.json
            fixtures/rsi/client-probe/package-lock.json
            fixtures/rsi/web-product/package-lock.json
            fixtures/rsi/acp/package-lock.json
      - name: Install pinned frontend package manager
        timeout-minutes: 5
        run: npm install --global pnpm@12.6.0
      - name: Cache frontend packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: target/rsi-app/pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: Install matching bindings generator
        id: bindings
        timeout-minutes: 15
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Install browser harness and engines
        id: browsers
        timeout-minutes: 10
        working-directory: fixtures/rsi-meta/browser-probe
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox
      - name: Exercise real Worker conformance
        id: meta_worker
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: fixtures/rsi-meta/browser-probe
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/meta_worker.log") 2>&1
          npm test
      - name: Exercise API ownership inside real Workers
        id: api_worker
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: fixtures/rsi-api/browser-probe
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/api_worker.log") 2>&1
          npm ci --ignore-scripts
          npm test
      - name: Exercise actual browser Fetch and cookie cleanup
        id: fetch
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: fixtures/rsi-api/browser-fetch
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/fetch.log") 2>&1
          npm ci --ignore-scripts
          npm test
      - name: Exercise shared application controllers inside real Workers
        id: controllers
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: fixtures/rsi/client-probe
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/controllers.log") 2>&1
          npm ci --ignore-scripts
          npm test

      - name: Install native Web product dependencies
        id: web_native
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap libdbus-1-dev pkg-config ripgrep musl-tools openssh-server
          sudo install -d -m 0755 /run/sshd
          python3 "$GITHUB_WORKSPACE/fixtures/rsi/browser-runtime/user_manager.py" prepare "$RUNNER_TEMP/rsi-user-manager.json"
          install -d -m 0700 "$HOME/rsi-ssh-ci"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSH_USER=$(id -un)" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSH_FIXTURES=$HOME/rsi-ssh-ci" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"
      - name: Install Web fixture packages
        id: web_harness
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: fixtures/rsi/web-product
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/web_harness.log") 2>&1
          npm ci --ignore-scripts

      - name: Build the paired Web application
        id: web_build
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' && steps.web_native.outcome == 'success' }}
        timeout-minutes: 40
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-evidence
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/web_build.log") 2>&1
          pnpm -C ../../../apps/web install --frozen-lockfile --ignore-scripts --store-dir "$GITHUB_WORKSPACE/target/rsi-app/pnpm-store"
          pnpm -C ../../../apps/web typecheck
          pnpm -C ../../../apps/web test
          pnpm -C ../../../apps/web build --debug

      - name: Exercise the product Web application over TLS and HTTP/2
        id: web_product
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' && steps.web_native.outcome == 'success' && steps.web_build.outcome == 'success' && steps.web_harness.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-evidence
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/web_product.log") 2>&1
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              previous_policy[$key]=$(sysctl -n "$key")
              sudo sysctl -w "$setting"
            fi
          done
          export RSI_PAIRED_BUNDLE="$GITHUB_WORKSPACE/target/rsi-app/current"
          npm test
          RSI_WEB_REPORT="$RUNNER_TEMP/rsi-web-evidence/alignment" node ui-alignment.mjs
          RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/dock-panels" node dock-panels.mjs
          RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/dock-durability" node dock-durability.mjs
          RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/navigation-order" node navigation-order.mjs
          RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/device-storage" node device-storage.mjs
          RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/review-lifecycle" node review-lifecycle.mjs
          RSI_WEB_REPORT="$RUNNER_TEMP/rsi-web-evidence/workbench" node workbench.mjs
          cd ../../..
          node fixtures/rsi/workbench-reference/settings-goldens.mjs --report "$RUNNER_TEMP/rsi-web-evidence/settings-goldens"
          git clone --filter=blob:none --no-checkout https://github.com/deepseek-ai/deepseek-harness "$RUNNER_TEMP/rsi-workbench-reference"
          git -C "$RUNNER_TEMP/rsi-workbench-reference" checkout --detach 4878cdabd87d4041bdaff61d04c966883b9fd07a
          RSI_DSH_REFERENCE="$RUNNER_TEMP/rsi-workbench-reference" node fixtures/rsi/workbench-reference/verify.mjs --report "$RUNNER_TEMP/rsi-web-evidence/workbench-reference"

      - name: Exercise canonical Workflow Dock and Node cleanup
        id: web_workflow
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' && steps.web_native.outcome == 'success' && steps.web_build.outcome == 'success' && steps.web_harness.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: fixtures/rsi/web-product
        run: |
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              previous_policy[$key]=$(sysctl -n "$key")
              sudo sysctl -w "$setting"
            fi
          done
          export RSI_PAIRED_BUNDLE="$GITHUB_WORKSPACE/target/rsi-app/current"
          RSI_TEST_NODE="$(command -v node)" RSI_WEB_REPORT="$RUNNER_TEMP/rsi-web-evidence/workflow-dock" node workflow-verify.mjs --dock-only

      - name: Preserve failed Web product log before integration probes
        if: ${{ !cancelled() && steps.web_product.outcome == 'failure' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-web-product-failure-log
          path: ${{ runner.temp }}/rsi-browser-logs/web_product.log
          if-no-files-found: error

      - name: Exercise paired Web integration probes
        id: web_integrations
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' && steps.web_native.outcome == 'success' && steps.web_build.outcome == 'success' && steps.web_harness.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-evidence
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          exec > >(tee "$RUNNER_TEMP/rsi-browser-logs/web_integrations.log") 2>&1
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              previous_policy[$key]=$(sysctl -n "$key")
              sudo sysctl -w "$setting"
            fi
          done
          export RSI_PAIRED_BUNDLE="$GITHUB_WORKSPACE/target/rsi-app/current"
          cd ../../..
          RSI_BUILD_FAMILY_MANIFEST="$RSI_PAIRED_BUNDLE/build-family.json" RSI_BUILD_FAMILY_SHA256="$(python3 -c 'import json,os; print(json.load(open(os.environ["RSI_PAIRED_BUNDLE"]+"/receipt.json"))["family_sha256"])')" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/rsi-app/build/target" cargo build --locked --manifest-path target/rsi-app/build/source/Cargo.toml --target x86_64-unknown-linux-gnu -p rsi-cli --example profile-leaf-probe
          RSI_PROFILE_PROBE="$GITHUB_WORKSPACE/target/rsi-app/build/target/x86_64-unknown-linux-gnu/debug/examples/profile-leaf-probe" RSI_REPORT_DIR="$RUNNER_TEMP/rsi-web-evidence/ssh-targets" node fixtures/rsi/web-product/ssh-targets.mjs
          cargo test --locked -p rsi-cli --features paired-web-tests --test service_host_cli web::web_alias_and_profile_serve_default_assets_with_stable_authorized_identity -- --exact
          npm ci --ignore-scripts --prefix fixtures/rsi/acp
          export RSI_ACP_SDK_NODE="$(command -v node)"
          export RSI_RUST_ANALYZER="$(rustup which rust-analyzer)"
          # These two opt-in integrations are explicit release probes. Exact-name
          # listing plus bash pipefail rejects a missing/renamed probe before execution.
          set -o pipefail
          cargo test --locked -p rsi-acp-host --test host independent_sdk_agent_new_permissions_resume_full_load_and_cancel -- --ignored --exact --list | rg --fixed-strings --line-regexp 'independent_sdk_agent_new_permissions_resume_full_load_and_cancel: test'
          cargo test --locked -p rsi-acp-host --test host independent_sdk_agent_new_permissions_resume_full_load_and_cancel -- --ignored --exact
          cargo test --locked -p rsi-lsp --lib tests::pinned_rust_analyzer_four_queries_under_native_read_only_sandbox -- --ignored --exact --list | rg --fixed-strings --line-regexp 'tests::pinned_rust_analyzer_four_queries_under_native_read_only_sandbox: test'
          cargo test --locked -p rsi-lsp --lib tests::pinned_rust_analyzer_four_queries_under_native_read_only_sandbox -- --ignored --exact
          cargo build --locked -p rsi-cli --example profile-leaf-probe
          export RSI_BINARY="$GITHUB_WORKSPACE/target/rsi-app/current/rsi"
          export RSI_WEB_ASSETS="$GITHUB_WORKSPACE/target/rsi-app/current/assets"
          node fixtures/rsi/acp/verify.mjs --binary "$RSI_BINARY" --output "$RUNNER_TEMP/rsi-acp-sdk-evidence"
          node fixtures/rsi/acp/browser.mjs "$RUNNER_TEMP/rsi-acp-browser-evidence"
          node fixtures/rsi/profile-management/browser.mjs "$RUNNER_TEMP/rsi-profile-browser-evidence"
          node fixtures/rsi/lsp/browser.mjs "$RUNNER_TEMP/rsi-lsp-browser-evidence"
          python3 fixtures/rsi/addon-workbench/run-paired.py "$RUNNER_TEMP/rsi-addon-paired-evidence"

      - name: Exercise isolated Web terminal application
        id: web_terminals
        if: ${{ !cancelled() && steps.bindings.outcome == 'success' && steps.browsers.outcome == 'success' && steps.web_native.outcome == 'success' && steps.web_build.outcome == 'success' && steps.web_harness.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_BINARY: ${{ github.workspace }}/target/rsi-app/current/rsi
          RSI_WEB_ASSETS: ${{ github.workspace }}/target/rsi-app/current/assets
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-terminal-evidence
        run: |
          mkdir -p "$RSI_WEB_REPORT"
          exec > >(tee "$RSI_WEB_REPORT/terminal-product.log") 2>&1
          test -x "$RSI_WEB_BINARY"
          test -d "$RSI_WEB_ASSETS"
          declare -A previous_policy
          restore_policy() {
            for key in "${!previous_policy[@]}"; do
              sudo sysctl -w "$key=${previous_policy[$key]}"
            done
          }
          trap restore_policy EXIT
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              previous_policy[$key]=$(sysctl -n "$key")
              sudo sysctl -w "$setting"
            fi
          done
          node terminal-verify.mjs
      - name: Exercise Session export downloads
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' && steps.web_harness.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: fixtures/rsi/web-product
        env:
          RSI_WEB_BINARY: ${{ github.workspace }}/target/rsi-app/current/rsi
          RSI_WEB_ASSETS: ${{ github.workspace }}/target/rsi-app/current/assets
          RSI_WEB_REPORT: ${{ runner.temp }}/rsi-web-export-evidence
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          node export-verify.mjs
      - name: Preserve paired addon evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-addon-paired-evidence
          path: ${{ runner.temp }}/rsi-addon-paired-evidence
          if-no-files-found: warn

      - name: Preserve Web terminal evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-web-terminal-evidence
          path: ${{ runner.temp }}/rsi-web-terminal-evidence
          if-no-files-found: warn

      - name: Record browser step outcomes
        timeout-minutes: 1
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
          PRODUCT_OUTCOME: ${{ steps.web_product.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/rsi-browser-logs"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          steps = json.loads(os.environ["STEP_OUTCOMES"])
          outcomes = {name: {field: value.get(field) for field in ("outcome", "conclusion")} for name, value in steps.items()}
          (root / "rsi-browser-logs/outcomes.json").write_text(json.dumps(outcomes))
          if os.environ["PRODUCT_OUTCOME"] == "success":
              report = json.loads((root / "rsi-web-evidence/results.json").read_text())
              assert len(report["results"]) == 2
              assert {row["browser"] for row in report["results"] if row["status"] == "passed"} == {"chromium", "firefox"}
          PY
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-web-evidence
          path: |
            ${{ runner.temp }}/rsi-browser-logs
            ${{ runner.temp }}/rsi-web-evidence
            ${{ runner.temp }}/rsi-web-export-evidence
            !${{ runner.temp }}/rsi-web-export-evidence/rsi
            ${{ runner.temp }}/rsi-acp-sdk-evidence
            ${{ runner.temp }}/rsi-acp-browser-evidence
            ${{ runner.temp }}/rsi-profile-browser-evidence
            ${{ runner.temp }}/rsi-lsp-browser-evidence
            !${{ runner.temp }}/rsi-web-evidence/chromium-recovery/rsi
            !${{ runner.temp }}/rsi-web-evidence/firefox-recovery/rsi
            !${{ runner.temp }}/rsi-web-evidence/chromium-tasks/rsi
            !${{ runner.temp }}/rsi-web-evidence/firefox-tasks/rsi
