            !${{ runner.temp }}/rsi-session-api-evaluation/session-api-eval
          if-no-files-found: warn
      - name: Exercise standard rsi on macOS
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.standard_build.outcome == 'success' && runner.os == 'macOS' }}
        env:
          RSI_TUI_PTY_REPORT: ${{ runner.temp }}/rsi-pty-evidence
        run: cargo test --locked -p rsi -p rsi-automation -p rsi-automation-api -p rsi-browser -p rsi-cli -p rsi-app-catalog -p rsi-app-tools -p rsi-build-info -p rsi-acp-application -p rsi-addon-testkit -p rsi-acp-agent -p 'rsi-lsp*' -p rsi-service-ui -p 'rsi-history*' -p rsi-service-host -p rsi-goal -p rsi-schedule -p 'rsi-session*' -p rsi-application -p rsi-gui -p rsi-workbench-ui -p 'rsi-configuration*' -p rsi-managed-providers -p 'rsi-navigation*' -p 'rsi-directory-picker*' -p 'rsi-client*' -p rsi-conversation -p 'rsi-ui*' -p rsi-inspector -p rsi-native-addons-api -p 'rsi-terminal*' -p rsi-serve -p 'rsi-web*' --all-targets --no-fail-fast -- --nocapture
        timeout-minutes: 20

      - name: Preserve source addon acceptance evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-source-addon-evidence
          path: |
            ${{ runner.temp }}/rsi-linked-template-evidence
            ${{ runner.temp }}/rsi-language-addon-evidence
            ${{ runner.temp }}/rsi-browser-evidence
            ${{ runner.temp }}/rsi-dev-smoke/logs
          if-no-files-found: warn
      - name: Preserve PTY evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-pty-${{ runner.os }}
          path: ${{ runner.temp }}/rsi-pty-evidence
          if-no-files-found: warn
      - name: Restore owned Linux user manager state
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: python3 fixtures/rsi/browser-runtime/user_manager.py restore "$RUNNER_TEMP/rsi-user-manager.json"

  repository-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Check repository formatting
        run: cargo fmt --all --check
        timeout-minutes: 10
      - name: Lint repository tools
        run: cargo clippy --locked -p rsi-xtask --all-targets -- -D warnings
        timeout-minutes: 15
      - name: Exercise repository tools
        run: cargo test --locked -p rsi-xtask --all-targets --no-fail-fast
        timeout-minutes: 15
      - name: Verify Browser fixture lifecycle and native gate failure propagation
        run: |
          python3 fixtures/tools/python-tests.py fixtures/rsi/browser-runtime
          node --test crates/rsi/browser/runtime/*.test.mjs
        timeout-minutes: 5

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo install cargo-audit --locked --version 0.22.2
        timeout-minutes: 15
      - name: Audit every committed Cargo lockfile
        timeout-minutes: 15
        shell: bash
        run: |
          status=0
          cargo audit --file ./Cargo.lock || status=1
          while IFS= read -r -d '' lockfile; do
            cargo audit --no-fetch --file "$lockfile" || status=1
          done < <(git ls-files -z -- '**/Cargo.lock')
          exit "$status"

  windows-rsi-meta:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "expected an x86_64 runner, found $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-15
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Exercise rsi-meta conformance and native echo-bidi
        run: cargo xtask rsi-meta conformance
        timeout-minutes: 45

  rsi-ssh-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 173
    env:
      CARGO_BUILD_JOBS: 2
      RUST_MIN_STACK: 268435456
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
      - name: Install isolated Linux SSH prerequisites
        timeout-minutes: 10
        id: ssh_prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openssh-server bubblewrap musl-tools libdbus-1-dev pkg-config
          sudo install -d -m 0755 /run/sshd
          python3 "$GITHUB_WORKSPACE/fixtures/rsi/browser-runtime/user_manager.py" prepare "$RUNNER_TEMP/rsi-user-manager.json"
          install -d -m 0700 "$HOME/rsi-ssh-ci"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSH_USER=$(id -un)" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSH_FIXTURES=$HOME/rsi-ssh-ci" >> "$GITHUB_ENV"
          echo "RSI_TEST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"
          echo "RSI_TEST_HELPER_BIN=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/rsi-ssh-helper" >> "$GITHUB_ENV"
      - id: ssh_setup
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' }}
        with:
          workspaces: . -> target
          key: ssh-linux
      - name: Lint Execution and SSH packages
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' }}
        run: cargo clippy --locked -p 'rsi-execution*' -p 'rsi-ssh*' --all-targets -- -D warnings
      - name: Test Execution and SSH packages
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' }}
        run: cargo test --locked -p 'rsi-execution*' -p 'rsi-ssh*' --all-targets
      - name: Build receipt-compatible static helper
        timeout-minutes: 20
        id: ssh_helper_build
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' }}
        run: cargo build --locked -p rsi-ssh-helper-app --release --target x86_64-unknown-linux-musl
      - name: Verify native manager and namespace support
        id: ssh_native
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_prerequisites.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          test -f /sys/fs/cgroup/cgroup.controllers
          test "$(systemctl --user show --property=ServiceWatchdogs --value)" = yes
          systemd-run --user --pipe --wait --collect --expand-environment=no /usr/bin/true
          bwrap --unshare-user --unshare-pid --ro-bind / / /usr/bin/true
      - name: Verify generated OpenSSH policy and trust
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-ssh-client --test openssh -- --ignored --nocapture
      - name: Verify SSH cache on the default stack
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          env -u RUST_MIN_STACK cargo test --locked -p rsi-ssh-helper --lib --test cache -- --ignored --nocapture
      - name: Verify target native lifecycle
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-ssh-helper-app --test native -- --ignored --nocapture
      - name: Verify cache and execution
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-ssh-helper --test execution -- --ignored --nocapture
      - name: Verify watchdog and cgroup cleanup
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-ssh-helper --test lifecycle native_watchdog_and_cgroup_cleanup -- --ignored --exact --nocapture
      - name: Verify source-reader sandbox
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-sandbox-local --test local native_source_reader_reads_tmp_ancestors_without_write_or_host_network_access -- --ignored --exact
      - name: Verify actual SSH execution, context, LSP, MCP and saturated control ACKs
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.ssh_setup.outcome == 'success' && steps.ssh_helper_build.outcome == 'success' && steps.ssh_native.outcome == 'success' }}
        run: |
          setting=kernel.apparmor_restrict_unprivileged_userns
          previous=$(sysctl -n "$setting")
          trap 'sudo sysctl -w "$setting=$previous"' EXIT
          sudo sysctl -w "$setting=0"
          cargo test --locked -p rsi-ssh-helper-app --test ssh -- --ignored --nocapture
      - name: Restore owned Linux user manager state
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: python3 fixtures/rsi/browser-runtime/user_manager.py restore "$RUNNER_TEMP/rsi-user-manager.json"

  ci-required:
    if: always()
    needs:
      - rsi-ssh-linux
      - rsi-desktop
      - documentation
      - lockfiles
      - rsi-meta-conformance
      - rsi-meta-browser
      - rsi-base
      - rsi-ai
      - rsi-agent
      - rsi
      - repository-tools
      - dependency-audit
      - windows-rsi-meta
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI contract
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os, sys
          results = {job: state.get("result") for job, state in json.loads(os.environ["NEEDS_JSON"]).items()}
          for job, result in results.items():
              print(f"{job}: {result}")
          sys.exit(not results or any(result != "success" for result in results.values()))

  rsi-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux desktop dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep libdbus-1-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev webkit2gtk-driver python3-gi gir1.2-webkit2-4.1 xvfb dbus-x11 bubblewrap libxtst6 musl-tools
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt,rust-analyzer
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
      - name: Lint and test desktop adapter
        timeout-minutes: 25
        run: |
          cargo clippy --locked -p rsi-desktop --all-targets -- -D warnings
          cargo test --locked -p rsi-desktop --all-targets --no-fail-fast
          cargo build --locked -p rsi-desktop --bin rsi-desktop
      - name: Exercise native admission
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run -a cargo run --locked --manifest-path fixtures/rsi/desktop-admission/Cargo.toml
      - name: Prepare native sandbox enforcement
        id: sandbox
        timeout-minutes: 10
        run: |
          : > "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
          for setting in kernel.unprivileged_userns_clone=1 kernel.apparmor_restrict_unprivileged_userns=0; do
            key=${setting%%=*}
            if [[ -e /proc/sys/${key//.//} ]]; then
              printf '%s=%s\n' "$key" "$(sysctl -n "$key")" >> "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
              sudo sysctl -w "$setting"
            fi
          done
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact --list | rg --fixed-strings --line-regexp 'native_bubblewrap_enforces_read_only_and_workspace_write_plans: test'
          cargo test --locked -p rsi-sandbox-local --test local native_bubblewrap_enforces_read_only_and_workspace_write_plans -- --ignored --exact
      - name: Install pinned frontend package manager
        timeout-minutes: 5
        run: |
          npm install --global pnpm@12.6.0
          npm ci --ignore-scripts --prefix fixtures/rsi/acp
      - name: Build shared document and desktop
        id: build
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo run --locked -p rsi-app-tools -- dist desktop "$RUNNER_TEMP/rsi-desktop-dist" --debug
      - name: Build incompatible desktop family
        id: foreign
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 100
        run: |
          RUSTFLAGS="-Cdebug-assertions=no" cargo run --locked -p rsi-app-tools -- dist desktop "$RUNNER_TEMP/rsi-desktop-foreign" --debug
      - name: Prepare Automation product runtime
        id: automation_runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          npm ci --ignore-scripts --prefix crates/rsi/browser/runtime
          npm ci --ignore-scripts --prefix fixtures/rsi/web-product
          (cd crates/rsi/browser/runtime && npx --no-install playwright install --with-deps chromium)
          browser_chromium=$(cd crates/rsi/browser/runtime && node --input-type=module -e 'import {chromium} from "playwright"; import path from "node:path"; console.log(path.dirname(chromium.executablePath()))')
          browser_node=$(readlink -f "$(command -v node)")
          browser_runtime="/run/user/$(id -u)"
          python3 fixtures/rsi/browser-runtime/user_manager.py prepare "$RUNNER_TEMP/rsi-user-manager.json"
          printf 'RSI_TEST_BROWSER_NODE=%s\nRSI_TEST_BROWSER_CHROMIUM=%s\nRSI_TEST_BROWSER_USER_RUNTIME=%s\n' "$browser_node" "$browser_chromium" "$browser_runtime" >> "$GITHUB_ENV"
      - name: Verify Automation through paired Web Desktop and TUI
        if: ${{ !cancelled() && steps.automation_runtime.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rsi-desktop-automation-evidence"
          export RSI_TEST_BROWSER_SCREENSHOT="$RUNNER_TEMP/rsi-desktop-automation-evidence/native.png"
          cargo test --locked -p rsi-browser --features test-support --test native -- --ignored --exact native_preview_check_and_retirement --list | rg --fixed-strings --line-regexp 'native_preview_check_and_retirement: test'
          cargo test --locked -p rsi-browser --features test-support --test native -- --ignored --exact native_preview_check_and_retirement --nocapture 2>&1 | tee "$RUNNER_TEMP/rsi-desktop-automation-evidence/native.log"
          cargo test --locked -p rsi --test session_service -- --ignored --exact automation::prepare_visual_fixture --list | rg --fixed-strings --line-regexp 'automation::prepare_visual_fixture: test'
          for surface in web desktop tui; do
            RSI_TEST_AUTOMATION_VISUAL_ROOT="$RUNNER_TEMP/rsi-automation-$surface-seed" RSI_TEST_AUTOMATION_VISUAL_PNG="$RSI_TEST_BROWSER_SCREENSHOT" cargo test --locked -p rsi --test session_service -- --ignored --exact automation::prepare_visual_fixture
          done
          RSI_WEB_BINARY="$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi" RSI_WEB_ASSETS="$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" RSI_AUTOMATION_WEB_SEED="$RUNNER_TEMP/rsi-automation-web-seed" RSI_AUTOMATION_WEB_REPORT="$RUNNER_TEMP/rsi-desktop-automation-evidence/web" node fixtures/rsi/web-product/automation-verify.mjs
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1000x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-automation-evidence/desktop" --daemon --automation-fixture "$RUNNER_TEMP/rsi-automation-desktop-seed"
          cargo test --locked -p rsi-cli --test service_host_cli -- --ignored --exact tui::automation::model_free_home_reads_automation_and_current_readiness --list | rg --fixed-strings --line-regexp 'tui::automation::model_free_home_reads_automation_and_current_readiness: test'
          RSI_TEST_AUTOMATION_BINARY="$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi" RSI_TEST_AUTOMATION_SEED="$RUNNER_TEMP/rsi-automation-tui-seed" RSI_TUI_PTY_REPORT="$RUNNER_TEMP/rsi-desktop-automation-evidence/tui.json" cargo test --locked -p rsi-cli --test service_host_cli -- --ignored --exact tui::automation::model_free_home_reads_automation_and_current_readiness
      - name: Exercise actual WebKitGTK first conversation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.foreign.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-evidence" --daemon --window-close --restart --save-failure --refresh-during-click --tasks --foreign-bundle "$RUNNER_TEMP/rsi-desktop-foreign/bundle" --file-previews --export
          RSI_TEST_NODE="$(command -v node)" dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-workflow-evidence" --workflows
          dbus-run-session -- xvfb-run -a /usr/bin/python3 fixtures/rsi/desktop-product/csp_engine.py --responses "$RUNNER_TEMP/rsi-desktop-evidence/preview-responses.json" --report "$RUNNER_TEMP/rsi-desktop-evidence/csp-engine.json"
      - name: Exercise WebKitGTK external, Profile, history and language surfaces
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          export RSI_RUST_ANALYZER="$(rustup which rust-analyzer)"
          for mode in external profiles history language workspace-review attention typed-results plan-review ui-alignment presentation queue reload; do
            mode_args=("--$mode")
            if [[ "$mode" == language ]]; then mode_args+=("$RSI_RUST_ANALYZER"); fi
            dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-$mode-evidence" "${mode_args[@]}"
          done
      - name: Exercise missing frame acknowledgement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-ack-evidence" --daemon --ack-timeout
      - name: Exercise actual WebKitGTK session terminals
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-terminal-evidence" --terminals --dock --window-close
      - name: Exercise document close deadline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 2560x1440x24" python3 fixtures/rsi/desktop-product/verify.py --binary "$RUNNER_TEMP/rsi-desktop-dist/bundle/rsi-desktop" --driver /usr/bin/WebKitWebDriver --assets "$RUNNER_TEMP/rsi-desktop-dist/bundle/assets" --report "$RUNNER_TEMP/rsi-desktop-close-evidence" --daemon --close-timeout
      - name: Restore owned Linux user manager state
        if: always()
        timeout-minutes: 5
        run: python3 fixtures/rsi/browser-runtime/user_manager.py restore "$RUNNER_TEMP/rsi-user-manager.json"
      - name: Restore native sandbox runner policy
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/rsi-desktop-sandbox-policy" ]]; then
            while IFS= read -r setting; do sudo sysctl -w "$setting"; done < "$RUNNER_TEMP/rsi-desktop-sandbox-policy"
          fi
      - name: Test desktop diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 fixtures/tools/python-tests.py fixtures/rsi/desktop-product
      - name: Preserve desktop acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: rsi-desktop-evidence
          path: |
            ${{ runner.temp }}/rsi-desktop-evidence
            ${{ runner.temp }}/rsi-desktop-*-evidence
            ${{ runner.temp }}/rsi-desktop-terminal-evidence
            ${{ runner.temp }}/rsi-desktop-close-evidence
            ${{ runner.temp }}/rsi-desktop-dist/bundle/receipt.json
            ${{ runner.temp }}/rsi-desktop-dist/bundle/build-family.json
            ${{ runner.temp }}/rsi-desktop-dist/build.log
            ${{ runner.temp }}/rsi-desktop-foreign/bundle/receipt.json
            ${{ runner.temp }}/rsi-desktop-foreign/bundle/build-family.json
            ${{ runner.temp }}/rsi-desktop-foreign/build.log
          if-no-files-found: warn
