name: performance-evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: performance-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  parser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fixtures/rsi/parser-fuzz -> target
          key: parser-check
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Type-check product-aligned parser fuzz targets
        run: |
          python3 fixtures/rsi/parser-fuzz/check-lock.py
          cargo check --locked --manifest-path fixtures/rsi/parser-fuzz/Cargo.toml --bins
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        surface: [store, gui, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          key: performance-${{ matrix.surface }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Verify evidence admission
        run: python3 -m unittest discover -s fixtures/rsi/performance -p 'test_*.py'
      - name: Collect raw measurements and provenance
        run: python3 fixtures/rsi/performance/run.py ${{ matrix.surface }} ${{ runner.temp }}/performance-evidence/${{ matrix.surface }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: performance-${{ matrix.surface }}-${{ github.sha }}
          path: ${{ runner.temp }}/performance-evidence/${{ matrix.surface }}
          if-no-files-found: warn
