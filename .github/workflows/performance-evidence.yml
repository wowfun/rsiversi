name: performance-evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: performance-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  parser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fixtures/rsi/parser-fuzz -> target
          key: parser-check
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Type-check product-aligned parser fuzz targets
        id: parser_check
        run: |
          python3 fixtures/rsi/parser-fuzz/check-lock.py
          cargo check --locked --manifest-path fixtures/rsi/parser-fuzz/Cargo.toml --bins
      - name: Prepare pinned fuzz tooling and test campaign ownership
        id: fuzz_setup
        run: |
          rustup toolchain install nightly-2026-10-24 --profile minimal --component rust-src
          cargo install cargo-fuzz --locked --version 0.13.2
          python3 fixtures/tools/python-tests.py fixtures/rsi/parser-fuzz
      - name: Fuzz apply-patch grammar
        if: ${{ !cancelled() && steps.parser_check.outcome == 'success' && steps.fuzz_setup.outcome == 'success' }}
        run: python3 fixtures/rsi/parser-fuzz/campaign.py apply_patch "${{ runner.temp }}/parser-fuzz/apply_patch"
      - name: Fuzz MCP framing
        if: ${{ !cancelled() && steps.parser_check.outcome == 'success' && steps.fuzz_setup.outcome == 'success' }}
        run: python3 fixtures/rsi/parser-fuzz/campaign.py mcp_frame "${{ runner.temp }}/parser-fuzz/mcp_frame"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: parser-fuzz-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parser-fuzz/apply_patch/metadata.json
            ${{ runner.temp }}/parser-fuzz/apply_patch/failure.bin
            ${{ runner.temp }}/parser-fuzz/mcp_frame/metadata.json
            ${{ runner.temp }}/parser-fuzz/mcp_frame/failure.bin
          if-no-files-found: warn
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        surface: [store, gui, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          key: performance-${{ matrix.surface }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes libdbus-1-dev pkg-config
      - name: Verify evidence admission
        run: python3 fixtures/tools/python-tests.py fixtures/rsi/performance
      - name: Collect raw measurements and provenance
        run: python3 fixtures/rsi/performance/run.py ${{ matrix.surface }} ${{ runner.temp }}/performance-evidence/${{ matrix.surface }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: performance-${{ matrix.surface }}-${{ github.sha }}
          path: ${{ runner.temp }}/performance-evidence/${{ matrix.surface }}
          if-no-files-found: warn
