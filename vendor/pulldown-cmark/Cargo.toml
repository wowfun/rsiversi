[package]
name = "pulldown-cmark"
version = "0.13.6"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/pulldown-cmark/pulldown-cmark"

[features]
default = ["html"]
html = ["dep:pulldown-cmark-escape"]
simd = ["pulldown-cmark-escape?/simd"]
conversation = ["dep:icu_properties"]

[dependencies]
bitflags = "2"
icu_properties = { version = "2.3", optional = true }
memchr = "2.5"
pulldown-cmark-escape = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
unicase = "2.6"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(rustbuild)"]
